services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    image: raidreplay-api:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://raidreplay:${DB_PASSWORD}@db:5432/raidreplay
      JWT_SECRET: ${JWT_SECRET}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_LOCAL_PATH: /data/videos
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      WCL_CLIENT_ID: ${WCL_CLIENT_ID:-}
      WCL_CLIENT_SECRET: ${WCL_CLIENT_SECRET:-}
    volumes:
      - video-data:/data/videos
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: raidreplay
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: raidreplay
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raidreplay -d raidreplay"]
      interval: 5s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

  # ── Optional: S3-compatible storage (MinIO) ───────────────────────────────
  minio:
    image: minio/minio
    profiles: ["s3"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio-data:/data
    ports:
      - "9001:9001"

  # ── Optional: server-side transcoding worker ──────────────────────────────
  worker:
    image: ghcr.io/yourorg/raidreplay-worker:latest
    profiles: ["worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://raidreplay:${DB_PASSWORD}@db:5432/raidreplay
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_LOCAL_PATH: /data/videos
    volumes:
      - video-data:/data/videos
    depends_on:
      db:
        condition: service_healthy

volumes:
  video-data:
  db-data:
  caddy-data:
  caddy-config:
  minio-data:
